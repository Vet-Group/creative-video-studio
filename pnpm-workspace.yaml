packages:
  - apps/*
  - packages/*
  - scripts
# Exact versions only, as in Ideas Hub.
saveExact: true
# Prebuilt binaries come as optional platform packages; their install scripts only re-check them.
allowBuilds:
  esbuild: false
  # Its install script downloads the ffmpeg binary the worker needs.
  ffmpeg-static: true
  sharp: false
  # onnxruntime-web (the worker's face score) pulls it in; its install script only sets up protobufjs's own CLI, which nothing here uses.
  protobufjs: false
