name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      # The same Postgres as ci.yml; serve.ts makes its own database on it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvs
          POSTGRES_PASSWORD: cvs-local-only
          POSTGRES_DB: cvs
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U cvs -d cvs"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      CI: '1'
      DATABASE_URL: postgres://cvs:cvs-local-only@127.0.0.1:5435/cvs
      S3_ENDPOINT: http://127.0.0.1:9400
      S3_ACCESS_KEY_ID: cvs
      S3_SECRET_ACCESS_KEY: cvs-local-only
      S3_BUCKET: cvs-media
      APP_URL: http://localhost:3400
      CVS_WEB_PORT: '3400'
      # Serve a production build: a 4-core runner keeps up with it, where `next dev` compiles routes while specs wait.
      CVS_E2E_BUILD: '1'
      # A throwaway value for the tests only. The specs run on mock models, so no provider key is set.
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # As in ci.yml: a service container cannot take the `server /data` command.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9400:9000 -e MINIO_ROOT_USER=cvs -e MINIO_ROOT_PASSWORD=cvs-local-only \
            chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285 server /data
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9400/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1

      # The runner image ships Google Chrome, which the config picks when there is no Edge.
      - name: E2E
        working-directory: apps/web
        run: pnpm exec playwright test --retries=0 --shard=${{ matrix.shard }}/6

      - name: Traces of failed specs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7
