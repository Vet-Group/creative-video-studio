# The conductor session cannot change the lockfile locally, so CI computes it and the main CI job then verifies it with --frozen-lockfile.
# The account's artifact storage quota is full, so the result goes to a new scratch branch lockfile/<run id> holding only that file, which the conductor copies from and deletes.
name: Lockfile

on:
  pull_request:
    paths:
      - '**/package.json'
      - pnpm-workspace.yaml
      - .github/workflows/lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    name: Compute pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Compute the lockfile
        run: pnpm install --lockfile-only

      - name: Publish it on a scratch branch
        run: |
          if git diff --quiet pnpm-lock.yaml; then echo "pnpm-lock.yaml is up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A parentless commit holding only the lockfile: GITHUB_TOKEN may not push history that touches workflow files.
          tree=$(printf '100644 blob %s\tpnpm-lock.yaml\n' "$(git hash-object -w pnpm-lock.yaml)" | git mktree)
          git push origin "$(git commit-tree "$tree" -m "Update pnpm-lock.yaml."):refs/heads/lockfile/$GITHUB_RUN_ID"
          echo "Published on lockfile/$GITHUB_RUN_ID"
