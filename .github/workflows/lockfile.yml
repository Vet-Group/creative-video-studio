# The conductor session cannot change the lockfile locally, so CI computes it and the main CI job then verifies it with --frozen-lockfile.
name: Lockfile

on:
  pull_request:
    paths:
      - '**/package.json'
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Compute pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Compute the lockfile
        run: pnpm install --lockfile-only

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
